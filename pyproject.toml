[project]
name = "megabot"
version = "0.1.0"
description = "Minimal modern FastAPI service with layered architecture"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
]

[project.scripts]
seed = "seeders.runner:main"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "seeders"]

[tool.ruff]
line-length = 100
target-version = "py314"
# Project root as the import root, so Ruff sorts `app` and `seeders` as first-party
# even though there are no __init__.py files.
src = ["."]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "B008",  # FastAPI dependency injection relies on calls in defaults
]
# flake8-type-checking ("TC") is deliberately NOT enabled. Under Python 3.14 it moves
# imports into `TYPE_CHECKING` blocks, which silently breaks FastAPI dependency
# injection, Pydantic models and SQLAlchemy mappings — they resolve annotations at runtime.

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["app", "seeders", "alembic"]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
# Project root as the import root: packages are implicit (no __init__.py).
extraPaths = ["."]
typeCheckingMode = "standard"
reportMissingTypeStubs = false

