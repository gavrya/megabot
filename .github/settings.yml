# Applied by the Probot Settings app (https://github.com/apps/settings).
# Install it on the repo; changes merged to main are synced automatically.
repository:
  name: megabot
  description: A megabot for the Signal messenger
  default_branch: main
  private: true
  has_issues: true
  has_projects: true
  has_wiki: false
  has_downloads: false

  # Squash-only merges into main
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: false
  squash_merge_commit_title: PR_TITLE
  squash_merge_commit_message: PR_BODY
  allow_auto_merge: true
  allow_update_branch: true
  delete_branch_on_merge: true
  web_commit_signoff_required: false

  enable_vulnerability_alerts: true
  enable_automated_security_fixes: true

branches:
  - name: main
    protection:
      required_pull_request_reviews:
        required_approving_review_count: 0
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
        require_last_push_approval: false
      required_status_checks:
        strict: true
        contexts:
          - lint-check
          - format-check
          - type-check
          - unit-tests
      required_conversation_resolution: true
      required_linear_history: true
      allow_force_pushes: false
      allow_deletions: false
      enforce_admins: true
      restrictions: null
